  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ============================================================
    // ⚠️ SUBSTITUA PELOS SEUS DADOS DO SUPABASE
    const SUPABASE_URL = 'https://xmuccqvtjyrhjlqgmwlm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_C9g6VFR-DOdTgnPsEHbK9A_d7Il5N96';
    // ============================================================
 
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 
    function formatarPreco(preco) {
      return preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
    }
 
    async function carregarFavoritos() {
      const favoritos = JSON.parse(localStorage.getItem('favoritos')) || [];
      const container = document.getElementById('lista-favoritos');
 
      if (favoritos.length === 0) {
        container.innerHTML = `
          <div class="col-12 vazio">
            <i class="bi bi-heart"></i>
            <p>Você ainda não tem imóveis favoritos.</p>
            <a href="category.html" class="btn btn-outline-secondary mt-2">Ver imóveis</a>
          </div>`;
        return;
      }
 
      const { data, error } = await sb.from('imoveis').select('*').in('id', favoritos);
 
      if (error || !data || data.length === 0) {
        container.innerHTML = `
          <div class="col-12 vazio">
            <i class="bi bi-heart"></i>
            <p>Nenhum favorito encontrado.</p>
            <a href="category.html" class="btn btn-outline-secondary mt-2">Ver imóveis</a>
          </div>`;
        return;
      }
 
      container.innerHTML = data.map(imovel => {
        const img = imovel.imagens && imovel.imagens.length > 0
          ? imovel.imagens[0]
          : 'assets/img/sem-foto.jpg';
 
        return `
          <div class="col-lg-4 col-md-6" id="card-${imovel.id}">
            <div class="card-imovel">
              <div class="card-img-wrap">
                <img src="${img}" alt="${imovel.titulo}" loading="lazy">
              </div>
              <div class="card-body-imovel">
                <h4><a href="blog-details.html?id=${imovel.id}">${imovel.titulo}</a></h4>
                <p style="font-size:13px; color:#888;"><i class="bi bi-geo-alt me-1"></i>${imovel.cidade}</p>
                <div class="card-preco">${formatarPreco(imovel.preco)}</div>
                <button class="btn-remover" onclick="remover('${imovel.id}')">
                  <i class="bi bi-heart-break me-1"></i> Remover dos favoritos
                </button>
              </div>
            </div>
          </div>`;
      }).join('');
    }
 
    function remover(id) {
      let lista = JSON.parse(localStorage.getItem('favoritos')) || [];
      lista = lista.filter(i => i !== id);
      localStorage.setItem('favoritos', JSON.stringify(lista));
      const card = document.getElementById('card-' + id);
      if (card) card.remove();
 
      if (document.querySelectorAll('[id^="card-"]').length === 0) {
        document.getElementById('lista-favoritos').innerHTML = `
          <div class="col-12 vazio">
            <i class="bi bi-heart"></i>
            <p>Você não tem mais imóveis favoritos.</p>
            <a href="category.html" class="btn btn-outline-secondary mt-2">Ver imóveis</a>
          </div>`;
      }
    }
 
    carregarFavoritos();
  </script>
