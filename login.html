<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Restrito - Choice Imobiliária</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #b8975a;
      --dark: #1a1a1a;
      --card-bg: #ffffff;
      --text: #2d2d2d;
      --muted: #888;
      --border: #e0d9ce;
      --error: #c0392b;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f0e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(184,151,90,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(26,26,26,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .card {
      background: var(--card-bg);
      border-radius: 2px;
      padding: 56px 48px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), #d4b578, var(--gold));
    }

    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-area .lock-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--gold), #d4b578);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo-area .lock-icon svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .logo-area h1 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--dark);
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }

    .logo-area p {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text);
      background: #faf8f5;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(184,151,90,0.12);
      background: #fff;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--dark);
      color: white;
      border: none;
      border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
      position: relative;
    }

    .btn:hover { background: #333; }
    .btn:active { transform: scale(0.99); }

    .btn.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .btn .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    .btn.loading .btn-text { display: none; }
    .btn.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .msg-erro {
      background: #fdf0ef;
      border: 1px solid #f5c6c2;
      border-left: 3px solid var(--error);
      color: var(--error);
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 2px;
      margin-top: 16px;
      display: none;
    }

    .msg-erro.visible { display: block; }

    .rodape {
      text-align: center;
      margin-top: 32px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-area">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </div>
      <h1>Choice Imobiliária</h1>
      <p>Acesso Restrito</p>
    </div>

    <div class="field">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
    </div>

    <div class="field">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn" id="btnLogin" onclick="login()">
      <span class="btn-text">Entrar</span>
      <span class="spinner"></span>
    </button>

    <div class="msg-erro" id="msgErro"></div>

    <div class="rodape">Área exclusiva para corretores</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ============================================================
    // ⚠️ SUBSTITUA PELOS SEUS DADOS DO SUPABASE
    const SUPABASE_URL = 'https://xmuccqvtjyrhjlqgmwlm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_C9g6VFR-DOdTgnPsEHbK9A_d7Il5N96';
    // ============================================================

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Enter para logar
    document.getElementById('senha').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const btn = document.getElementById('btnLogin');
      const erro = document.getElementById('msgErro');

      erro.classList.remove('visible');

      if (!email || !senha) {
        mostrarErro('Preencha e-mail e senha.');
        return;
      }

      btn.classList.add('loading');

      const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });

      btn.classList.remove('loading');

      if (error) {
        mostrarErro('E-mail ou senha incorretos.');
        return;
      }

      window.location.href = 'admin.html';
    }

    function mostrarErro(msg) {
      const el = document.getElementById('msgErro');
      el.textContent = msg;
      el.classList.add('visible');
    }

    // Redireciona se já estiver logado
    sb.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = 'admin.html';
    });
  </script>
</body>
</html>
